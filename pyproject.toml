[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-tools"
version = "0.1.0"
description = "Tensor linear algebra utilities"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Jeremie" }
]
dependencies = [
  "numpy",
  "torch",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["toolbox*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc"]
